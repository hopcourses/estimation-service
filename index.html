<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allez HOP! - Devis Éclair</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        :root {
            --hop-blue: #003366;
            --hop-orange: #ff9100;
        }

        /* Motif décoratif en fond : tracés en pointillés rappelant un itinéraire */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8fafc;
            background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 110 q 50 -100 100 0' fill='none' stroke='%23003366' stroke-width='2' stroke-dasharray='6,6' opacity='0.05'/%3E%3Ccircle cx='110' cy='110' r='4' fill='%23ff9100' opacity='0.1'/%3E%3C/svg%3E");
            padding: 20px; 
            color: var(--hop-blue); 
        }

        .container { 
            max-width: 550px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.1); 
            position: relative;
        }

        h2 { text-align: center; color: var(--hop-blue); margin-top: 0; font-size: 28px; }
        h2 span { color: var(--hop-orange); }
        
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: var(--hop-blue); }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; color: var(--hop-blue); transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--hop-orange); outline: none; }
        
        /* Conteneur d'autocomplétion */
        .autocomplete-container { position: relative; }
        .autocomplete-items {
            position: absolute; border: 1px solid #e2e8f0; border-bottom: none; border-top: none; 
            z-index: 99; top: 100%; left: 0; right: 0; border-radius: 0 0 8px 8px; 
            background-color: white; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .autocomplete-items div {
            padding: 10px; cursor: pointer; border-bottom: 1px solid #e2e8f0; font-size: 14px;
        }
        .autocomplete-items div:hover { background-color: var(--hop-orange); color: white; }
        
        .row { display: flex; gap: 15px; }
        .row > div { flex: 1; }
        
        #map { height: 250px; width: 100%; border-radius: 8px; margin-top: 20px; border: 2px solid var(--hop-blue); z-index: 1; }
        .leaflet-routing-container { display: none !important; }
        
        .price-box { 
            background: rgba(255, 145, 0, 0.1); border: 2px dashed var(--hop-orange); 
            padding: 20px; text-align: center; font-size: 28px; font-weight: bold; 
            color: var(--hop-orange); border-radius: 12px; margin-top: 25px; 
        }
        .mention { font-size: 12px; color: #64748b; text-align: center; margin-top: 8px; }
        
        #btn-valider { 
            width: 100%; padding: 16px; background: var(--hop-orange); color: white; 
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; 
            cursor: pointer; margin-top: 20px; transition: 0.3s; box-shadow: 0 4px 10px rgba(255, 145, 0, 0.3);
        }
        #btn-valider:hover { background: #e07f00; transform: translateY(-2px); }
        #btn-valider:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; transform: none; }
        #message-succes { display: none; text-align: center; color: #10b981; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Allez <span>HOP!</span></h2>
    
    <label for="email">E-mail expéditeur</label>
    <input type="email" id="email" placeholder="votre@email.com" required>

    <label for="service">Service & Taille</label>
    <select id="service" onchange="calculerPrix()">
        <option value="">Sélectionnez un service...</option>
        <option value="Drive alimentaire - Taille S">Drive alimentaire - Taille S</option>
        <option value="Drive alimentaire - Taille M">Drive alimentaire - Taille M</option>
        <option value="Drive alimentaire - Taille L">Drive alimentaire - Taille L</option>
        <option value="Drive alimentaire - Taille XL">Drive alimentaire - Taille XL</option>
        <option value="Drive alimentaire - Taille XXL">Drive alimentaire - Taille XXL</option>
        <option value="Colis - Taille S">Colis - Taille S</option>
        <option value="Colis - Taille M">Colis - Taille M</option>
        <option value="Colis - Taille L">Colis - Taille L</option>
        <option value="Colis - Taille XL">Colis - Taille XL</option>
        <option value="Colis - Taille XXL">Colis - Taille XXL</option>
        <option value="Équipement Moyen - Taille M">Équipement Moyen - Taille M</option>
        <option value="Équipement Moyen - Taille L">Équipement Moyen - Taille L</option>
        <option value="Équipement Moyen - Taille XL">Équipement Moyen - Taille XL</option>
        <option value="Équipement Volumineux - Taille L">Équipement Volumineux - Taille L</option>
        <option value="Équipement Volumineux - Taille XL">Équipement Volumineux - Taille XL</option>
        <option value="Équipement Volumineux - Taille XXL">Équipement Volumineux - Taille XXL</option>
    </select>

    <label>Trajet de livraison</label>
    <div class="autocomplete-container">
        <input type="text" id="adresse-depart" placeholder="Adresse de collecte">
        <div id="autocomplete-list-depart" class="autocomplete-items"></div>
    </div>
    
    <div class="autocomplete-container" style="margin-top: 10px;">
        <input type="text" id="adresse-arrivee" placeholder="Adresse de livraison">
        <div id="autocomplete-list-arrivee" class="autocomplete-items"></div>
    </div>

    <div id="map"></div>

    <div class="row">
        <div>
            <label for="distance">Distance (km)</label>
            <input type="number" id="distance" readonly style="background-color: #f1f5f9; border-color: #f1f5f9; color: #64748b;">
        </div>
        <div>
            <label for="etages">Nombre d'étages</label>
            <input type="number" id="etages" min="0" value="0" oninput="calculerPrix()">
        </div>
    </div>

    <div class="price-box">
        <span id="affichage-prix">0,00</span> €
    </div>
    <div class="mention">Une remise partenaire de 10 % s'appliquera automatiquement à la facturation si votre compte y est éligible.</div>

    <button id="btn-valider" onclick="envoyerCommande()" disabled>Demander la livraison</button>
    <div id="message-succes">Mission transmise à nos cotransporteurs !</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script>
let prixActuel = 0;
let coordsDepart = null;
let coordsArrivee = null;

// Initialisation de la carte (centrée sur Bailleul)
const map = L.map('map').setView([50.7339, 2.7338], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const routingControl = L.Routing.control({
    waypoints: [],
    lineOptions: { styles: [{color: '#ff9100', opacity: 0.9, weight: 6}] },
    show: false,
    addWaypoints: false,
    routeWhileDragging: false,
    fitSelectedRoutes: true
}).addTo(map);

// Récupération de la distance calculée par Leaflet
routingControl.on('routesfound', function(e) {
    let distanceKm = (e.routes[0].summary.totalDistance / 1000).toFixed(1);
    document.getElementById('distance').value = distanceKm;
    calculerPrix();
});

// Autocomplétion via l'API nationale des adresses (Data Gouv)
let timeoutId;
function configurerAutocomplete(inputId, listId, isDepart) {
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);

    input.addEventListener('input', function() {
        clearTimeout(timeoutId);
        list.innerHTML = '';
        let query = this.value;
        if (query.length < 3) return;

        timeoutId = setTimeout(async () => {
            try {
                let response = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(query)}&limit=5`);
                let data = await response.json();
                
                data.features.forEach(feature => {
                    let div = document.createElement("div");
                    div.innerHTML = feature.properties.label;
                    div.addEventListener("click", function() {
                        input.value = feature.properties.label;
                        list.innerHTML = '';
                        
                        // L'API renvoie [longitude, latitude]
                        let coords = L.latLng(feature.geometry.coordinates[1], feature.geometry.coordinates[0]);
                        if (isDepart) coordsDepart = coords;
                        else coordsArrivee = coords;
                        
                        tracerItineraire();
                    });
                    list.appendChild(div);
                });
            } catch (err) { console.error("Erreur API Adresse"); }
        }, 300);
    });

    document.addEventListener("click", function (e) {
        if (e.target !== input) list.innerHTML = '';
    });
}

configurerAutocomplete("adresse-depart", "autocomplete-list-depart", true);
configurerAutocomplete("adresse-arrivee", "autocomplete-list-arrivee", false);

function tracerItineraire() {
    if (coordsDepart && coordsArrivee) {
        routingControl.setWaypoints([coordsDepart, coordsArrivee]);
    }
}

// Moteur de tarification explicite (Identique à la validation précédente)
function calculerPrix() {
    let serviceStr = document.getElementById('service').value;
    let distanceVal = parseFloat(document.getElementById('distance').value) || 0;
    let etages = parseInt(document.getElementById('etages').value) || 0;
    let btnValider = document.getElementById('btn-valider');

    if (!serviceStr || distanceVal <= 0) {
        document.getElementById('affichage-prix').innerText = "0,00";
        btnValider.disabled = true;
        return;
    }
    btnValider.disabled = false;

    let elements = serviceStr.split(" - Taille ");
    if (elements.length !== 2) return;
    let branche = elements[0].trim();
    let taille = elements[1].trim();

    let tarifPalier = 0;
    let distanceGrille = Math.min(distanceVal, 30);
    let kmSupp = distanceVal > 30 ? Math.ceil(distanceVal - 30) : 0;
    let supplementEtage = 0;
    let multiplicateur = 1.03;
    let sousTotal = 0;

    if (branche === "Drive alimentaire") {
        if (distanceGrille < 2) tarifPalier = 5;
        else if (distanceGrille < 5) tarifPalier = 5.50;
        else if (distanceGrille < 10) tarifPalier = 6;
        else if (distanceGrille < 15) tarifPalier = 8;
        else if (distanceGrille < 20) tarifPalier = 12;
        else tarifPalier = 15;

        let supplementTaille = (taille === "XL" || taille === "XXL") ? 1.00 : 0;
        if (etages > 2) supplementEtage = 0.50;
        sousTotal = tarifPalier + kmSupp + supplementTaille + supplementEtage + 2.25;
    }
    else if (branche === "Colis") {
        let isSup = (taille === "XL" || taille === "XXL");
        if (distanceGrille < 5) tarifPalier = isSup ? 6 : 5;
        else if (distanceGrille < 10) tarifPalier = isSup ? 8 : 6;
        else if (distanceGrille < 15) tarifPalier = isSup ? 10 : 8;
        else if (distanceGrille < 20) tarifPalier = isSup ? 12 : 9;
        else tarifPalier = isSup ? 15 : 12;
        sousTotal = tarifPalier + kmSupp + 2.25; 
    }
    else if (branche === "Équipement Moyen") {
        if (distanceGrille < 5) tarifPalier = (taille === "M") ? 7 : (taille === "L") ? 10 : 13;
        else if (distanceGrille < 10) tarifPalier = (taille === "M") ? 9 : (taille === "L") ? 13 : 16;
        else if (distanceGrille < 15) tarifPalier = (taille === "M") ? 11 : (taille === "L") ? 15 : 19;
        else if (distanceGrille < 20) tarifPalier = (taille === "M") ? 13 : (taille === "L") ? 18 : 25;
        else tarifPalier = (taille === "M") ? 15 : (taille === "L") ? 20 : 30;

        if (etages > 2) supplementEtage = 0.50;
        sousTotal = tarifPalier + kmSupp + supplementEtage + 3.25;
        if (sousTotal >= 30) multiplicateur = 1.06;
    }
    else if (branche === "Équipement Volumineux") {
        if (distanceGrille < 5) tarifPalier = (taille === "L" || taille === "XL") ? 15 : 20;
        else if (distanceGrille < 10) tarifPalier = (taille === "L") ? 18 : (taille === "XL") ? 20 : 25;
        else if (distanceGrille < 15) tarifPalier = (taille === "L") ? 22 : (taille === "XL") ? 25 : 30;
        else if (distanceGrille < 20) tarifPalier = (taille === "L") ? 25 : (taille === "XL") ? 30 : 35;
        else tarifPalier = (taille === "L") ? 29 : (taille === "XL") ? 35 : 45;

        if (etages >= 2) supplementEtage = 1.00;
        sousTotal = tarifPalier + kmSupp + supplementEtage + 3.25;
        if (sousTotal >= 30) multiplicateur = 1.06;
    }

    prixActuel = Math.round(sousTotal * multiplicateur * 1.20 * 100) / 100;
    document.getElementById('affichage-prix').innerText = prixActuel.toFixed(2).replace(".", ",");
}

function envoyerCommande() {
    let email = document.getElementById('email').value;
    let service = document.getElementById('service').value;
    let distance = document.getElementById('distance').value;
    let btnValider = document.getElementById('btn-valider');

    if (!email || !service || !distance) return;

    const payload = {
        email_expediteur: email,
        service_taille: service,
        distance_km: distance,
        etages: document.getElementById('etages').value,
        adresse_depart: document.getElementById('adresse-depart').value,
        adresse_arrivee: document.getElementById('adresse-arrivee').value,
        prix_public: prixActuel
    };

    btnValider.innerText = "Envoi en cours...";
    btnValider.disabled = true;

    fetch("https://hook.eu1.make.com/VOTRE_WEBHOOK_ICI", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).then(() => {
        document.getElementById('message-succes').style.display = "block";
        btnValider.style.display = "none";
    }).catch(() => {
        alert("Erreur de connexion.");
        btnValider.innerText = "Demander la livraison";
        btnValider.disabled = false;
    });
}
</script>

</body>
</html>
